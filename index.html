<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دورة احتراف اختبار STEP - أكاديمية عايد</title>

  <!-- Bootstrap 5 (RTL build) + Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Project styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-page">

  <!-- Overall course progress bar (fixed to the very top of the viewport) -->
  <div class="top-progress-track">
    <div id="top-progress-fill" class="top-progress-fill" style="width:0%"></div>
  </div>

  <!-- Header: breadcrumb, course title, progress summary, focus mode toggle -->
  <header class="app-header">
    <div class="container-fluid max-w-1440 px-3 px-lg-5 py-3" id="header-container">
      <!-- filled by render.js -> renderHeader() -->
    </div>
  </header>

  <!-- Main layout: sidebar (course outline) + content pane -->
  <main class="container-fluid max-w-1440 px-3 px-lg-5 py-4">
    <div class="row g-4 align-items-start">
      <div id="sidebar-col" class="col-12 col-lg-4 sidebar-col">
        <!-- filled by render.js -> renderSidebar() -->
      </div>
      <section id="main-content-col" class="col-12 col-lg-8 d-flex flex-column gap-4">
        <!-- filled by render.js -> renderMainContent() -->
      </section>
    </div>
  </main>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container-pro"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container-fluid max-w-1440 px-3 px-lg-5 d-flex flex-column flex-sm-row align-items-center justify-content-between gap-2 fs-12 text-secondary">
      <div class="d-flex align-items-center gap-2">
        <span class="footer-logo-badge">A</span> أكاديمية عايد
      </div>
      <div class="d-flex align-items-center gap-3">
        <span>© 2026 جميع الحقوق محفوظة</span>
        <span class="d-flex align-items-center gap-1">
          <i class="bi bi-shield-lock"></i> محتوى محمي
        </span>
      </div>
    </div>
  </footer>

  <!-- App scripts, loaded in dependency order -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/player.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
